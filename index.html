@property --bg{syntax:'<color>';inherits:true;initial-value:#1b1c22}
@property --fg{syntax:'<color>';inherits:true;initial-value:#e4e6ef}
@property --ac{syntax:'<color>';inherits:true;initial-value:#aec6ff}
:root{--bg:#1b1c22;--fg:#e4e6ef;--ac:#aec6ff;--mut:color-mix(in srgb,var(--fg) 55%,transparent);--ln:color-mix(in srgb,var(--fg) 22%,transparent);--tl:color-mix(in srgb,var(--ac) 28%,transparent);--gv:color-mix(in srgb,var(--fg) 12%,transparent);--sp:cubic-bezier(.34,1.56,.64,1);--sm:cubic-bezier(.22,1,.36,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:--bg .5s,--fg .5s,--ac .5s}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{fill:currentColor;display:block}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateY(14px) scale(.97);transition:opacity .55s ease,transform .65s var(--sm),visibility 0s .55s}
.flip .scr{transition:none}
.scr.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:transform .35s var(--sp),background .3s,color .3s}
.ib:active{transform:scale(.86);transition-duration:.12s}
#back{position:absolute;top:14px;left:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}#back.on{opacity:1;pointer-events:auto}
#tb{position:absolute;top:14px;left:14px;right:14px;height:46px;z-index:21;pointer-events:none}
#bar{position:absolute;right:0;top:0;height:46px;width:46px;border-radius:23px;border:1.5px solid var(--ln);background:var(--bg);overflow:hidden;opacity:0;transition:width .5s cubic-bezier(.2,.8,.2,1),opacity .25s}
.open #bar{width:100%;opacity:1;pointer-events:auto}
#sw{display:flex;gap:16px;align-items:center;height:100%;padding:0 64px 0 14px;overflow-x:auto;scrollbar-width:none}
#sw i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sb);position:relative;box-shadow:0 0 0 1px var(--ln);cursor:pointer;transition:transform .2s,box-shadow .25s;opacity:0;transform:scale(.4)}
.open #sw i{opacity:1;transform:none;transition-delay:calc(var(--i)*35ms + .15s)}
#sw i::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--sa)}
#sw i.sel{box-shadow:0 0 0 3px var(--ac),0 0 0 5px var(--bg);filter:drop-shadow(0 0 6px var(--ac))}
#pal{position:absolute;right:0;top:0;pointer-events:auto}
.open #pal{background:var(--ac);color:var(--bg);transform:rotate(-25deg)}

function countSol(g,lim){const r=Array(9).fill(0),c=Array(9).fill(0),b=Array(9).fill(0);let n=0;

 (function go(){let best=-1,bm=0,bc=10;
  for(let i=0;i<81;i++)if(!g[i]){const m=~(r[R(i)]|c[C(i)]|b[B(i)])&0x3fe,k=pop(m);if(k<bc){bc=k;best=i;bm=m;if(k<2)break}}

/* technique levels: 1 naked single, 2 hidden single, 3 pairs/locked candidates, 4 triples/X-Wing, 5 beyond */
function findStep(v,cd){

/* Generator: remove clues one by one, keeping (a) a UNIQUE solution and (b) a rating never above the chosen level.

  const ng={lv,sol:r.sol,giv:r.p.map(x=>x?1:0),val:r.p.slice(),notes:Array(81).fill(0),sel:-1,t:0,hist:[],fut:[],help:0,over:0,au:[0,0,0,0],daily:1,date:ds};

$('#lp').onclick=()=>{S.lv--;home(-1);save()};$('#ln').onclick=()=>{S.lv++;home(1);save()};
function startNew(){const b=$('#bNew'),sm=b.querySelector('small'),lv=S.lv,lg=$('#logo'),fin=r=>{newGame(lv,r);sm.textContent='New';b.disabled=false;lg.classList.remove('gen')};if(!pool[lv]){sm.textContent='Generating…';b.disabled=true;lg.classList.add('gen')}getP(lv,fin)}
$('#bNew').onclick=()=>{if(lg()){ov('<p>Your saved progress of previous game will be lost.<br>Are you sure you want to continue?</p><div class="row2"><button class="pill" id="nc">Cancel</button><button class="pill" id="ny">New game</button></div>','wcard cf');$('#nc').onclick=cov;$('#ny').onclick=()=>{cov();setTimeout(startNew,250)}}else startNew()};
$('#bRes').onclick=()=>{const g=lg();if(!g)return;G=g;daily=0;enterGame()};
$('#bSet').onclick=()=>go('set');$('#bTm').onclick=()=>{TL=S.lv;go('times');tm()};
document.body.classList.toggle('na',!S.an);

/* game */
const grid=$('#grid'),cells=[];
for(let i=0;i<81;i++){const d=document.createElement('div');d.className='c';d.style.setProperty('--i',i);d.style.setProperty('--d',Math.abs(R(i)-4)+Math.abs(C(i)-4));d.innerHTML='<div class="k"></div>';grid.appendChild(d);cells.push(d)}
grid.addEventListener('pointerdown',e=>{const el=e.target.closest('.c');if(!el||!G||G.over)return;const i=cells.indexOf(el);lt2=0;
 if(S.hd)el._h=setTimeout(()=>{el._h=0;el._long=1;if(!G.giv[i]){G.sel=i;erase()}},550)});
let lt2;
grid.addEventListener('pointerup',e=>{const el=e.target.closest('.c');if(!el)return;clearTimeout(el._h);if(el._long){el._long=0;return}tap(cells.indexOf(el))});
grid.addEventListener('pointerleave',()=>cells.forEach(c=>clearTimeout(c._h)),true);
function tap(i){if(!G||G.over)return;if(arm){G.sel=-1;fill(i);return}const n=Date.now();if(S.dt&&G.sel==i&&n-lt<320&&!G.giv[i]){lt=0;erase();return}lt=n;G.sel=i;feel('sel');render()}
const pad=$('#pad');
for(let d=1;d<11;d++){const b=document.createElement('button');b.dataset.d=d;b.onclick=()=>{if(!G||G.over)return;if(d>9){arm=0;erase();render();return}if(!arm&&G.sel>=0&&!G.giv[G.sel]){place(d);return}arm=arm==d?0:d;G.sel=-1;feel('sel');render()};pad.appendChild(b)}
const locked=i=>G.giv[i];
function fill(i){if(G.giv[i])return;if(pen){if(G.val[i])return;snap();G.notes[i]^=1<<arm;feel('note')}
 else if(G.val[i]==arm){snap();G.val[i]=0}
 else{snap();G.val[i]=arm;G.notes[i]=0;if(S.ap)for(let j=0;j<81;j++)if(peer(i,j))G.notes[j]&=~(1<<arm);bump(i)}
 render();chk();save()}
const dt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function snap(){G.mm=null;if(G.hl)hideHint();G.fut=[];G.hist.push({v:G.val.slice(),n:G.notes.slice()});if(G.hist.length>400)G.hist.shift()}
function bump(i){feel('put');const c=cells[i];c._p=1;c.classList.add('p');setTimeout(()=>{c._p=0;c.classList.remove('p')},480)}
function place(d){if(!G||G.over||G.sel<0||locked(G.sel))return;const i=G.sel;
 if(pen){if(G.val[i])return;snap();G.notes[i]^=1<<d;feel('note')}
 else{if(G.val[i]==d)return;snap();G.val[i]=d;G.notes[i]=0;if(S.ap)for(let j=0;j<81;j++)if(peer(i,j))G.notes[j]&=~(1<<d);bump(i)}
 render();chk();save()}
function erase(){if(!G||G.over||G.sel<0||locked(G.sel))return;const i=G.sel;if(!G.val[i]&&!G.notes[i])return;snap();feel('del');G.val[i]=0;G.notes[i]=0;render();save()}
document.addEventListener('keydown',e=>{if(cur!='game'||!G||G.over||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key>='1'&&e.key<='9'){e.preventDefault();if(G.sel>=0&&!G.giv[G.sel])place(+e.key);return}
 if(e.key=='Backspace'||e.key=='Delete'||e.key=='0'){e.preventDefault();erase();return}
 if(e.key=='p'||e.key=='P'){e.preventDefault();pen=!pen;render();return}
 const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
 if(mv==null)return;e.preventDefault();let i=G.sel<0?40:G.sel;const r=R(i),c=C(i);
 if((e.key=='ArrowLeft'&&c==0)||(e.key=='ArrowRight'&&c==8)||(e.key=='ArrowUp'&&r==0)||(e.key=='ArrowDown'&&r==8))return;
 arm=0;G.sel=i+mv;feel('sel');render()});
$('#undo').onclick=()=>{if(!G||G.over||!G.hist.length)return;(G.fut=G.fut||[]).push({v:G.val.slice(),n:G.notes.slice()});const h=G.hist.pop();G.val=h.v;G.notes=h.n;render();save()};
$('#redo').onclick=()=>{if(!G||G.over||!G.fut||!G.fut.length)return;G.hist.push({v:G.val.slice(),n:G.notes.slice()});const h=G.fut.pop();G.val=h.v;G.notes=h.n;render();save()};
$('#pen').onclick=()=>{pen=!pen;render()};
function doHint(){if(!G||G.over)return;let i=G.sel;
 if(i<0||G.giv[i]||G.val[i]==G.sol[i]){const c=[];G.val.forEach((v,k)=>{if(!G.giv[k]&&v!=G.sol[k])c.push(k)});if(!c.length)return;i=c[~~(Math.random()*c.length)]}
 snap();G.val[i]=G.sol[i];G.notes[i]=0;G.sel=i;G.help=1;if(S.ap)for(let j=0;j<81;j++)if(peer(i,j))G.notes[j]&=~(1<<G.sol[i]);bump(i);render();chk();save()}
const IC={b:'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M9 21c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-1H9zm3-19a7 7 0 0 0-4 12.7V17c0 .6.4 1 1 1h6c.6 0 1-.4 1-1v-2.3A7 7 0 0 0 12 2z"/></svg>',e:'<svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>',c:'<svg width="28" height="28" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',p:'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.75 3.75z"/></svg>'};
const UN=['row','column','box'],NM={p:'a naked pair',l:'a locked candidate',t:'a naked triple',x:'an X-Wing'};
function explain(){
 if(G.val.some((x,i)=>x&&x!=G.sol[i]))return{msg:'One of your numbers looks wrong. Try Mismatches first.'};
 const v=G.val.slice(),cd=cands(v);let st,el=null;
 for(let k=0;k<80;k++){st=findStep(v,cd);if(!st||st.c!=null)break;el=st;apply(v,cd,st)}
 if(!st){let c=-1,b=9;G.val.forEach((x,i)=>{if(!x&&pop(cd[i])<b){b=pop(cd[i]);c=i}});if(c<0)return{msg:'Nothing left to hint.'};return{c,hl:[c],msg:`Look at row ${R(c)+1}, column ${C(c)+1}. It has the fewest options left (${b}).`}}
 const c=st.c,wh=`row ${R(c)+1}, column ${C(c)+1}`;
 if(el)return{c,hl:el.e.map(x=>x[0]).concat(c),msg:`Look near ${wh}. ${NM[el.t][0].toUpperCase()+NM[el.t].slice(1)} rules out some options, which leaves only ${st.d} there.`};
 if(st.t=='n')return{c,hl:[c,...U[3*R(c)],...U[3*C(c)+1],...U[3*B(c)+2]],msg:`Row ${R(c)+1}, column ${C(c)+1} can only be ${st.d}: every other digit is already in its row, column or box.`};
 return{c,hl:U[st.u],msg:`In this ${UN[st.u%3]}, the digit ${st.d} fits in only one cell: ${wh}.`}}
function showHint(){G.help=1;const e=explain();if(e.c==null){toast(e.msg);return}G.sel=e.c;arm=0;G.hl=e.hl;$('#hpm').textContent=e.msg;$('#hp').classList.add('on');$('#game').classList.add('hint');render();save()}
function hideHint(){$('#hp').classList.remove('on');$('#game').classList.remove('hint');if(G&&G.hl){G.hl=null;render()}}
$('#hpo').onclick=hideHint;$('#hpr').onclick=()=>{hideHint();doHint()};
const H={hint:showHint,
 mism(){G.help=1;const m=[];G.val.forEach((v,i)=>{if(v&&!G.giv[i]&&v!=G.sol[i])m.push(i)});if(!m.length){toast('No mismatches found');return}G.mm=m;render();setTimeout(()=>{if(G&&G.mm==m){G.mm=null;render()}},5000)},
 valid(){G.help=1;toast(G.val.some((v,i)=>v&&!G.giv[i]&&v!=G.sol[i])?'There are mistakes on the board':'All good so far ✓')},
 auto(){G.help=1;snap();G.val.forEach((v,i)=>{if(v)return;let m=0;for(let j=0;j<81;j++)if(peer(i,j)&&G.val[j])m|=1<<G.val[j];G.notes[i]=~m&0x3fe});render();save();toast('Notes filled in')}};
function helpMenu(){if(!G||G.over)return;
 ov(`<div style="color:var(--ac);display:grid;place-items:center"><svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M9 21c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-1H9zm3-19a7 7 0 0 0-4 12.7V17c0 .6.4 1 1 1h6c.6 0 1-.4 1-1v-2.3A7 7 0 0 0 12 2z"/></svg></div><p class="hn">Note: Using help transfers your time to a separate leaderboard.</p><button class="pill" data-h="hint">${IC.b}Hint</button><button class="pill" data-h="mism">${IC.e}Mismatches</button><button class="pill" data-h="valid">${IC.c}Validate</button><button class="pill" data-h="auto">${IC.p}Auto Notes</button><button class="pill cls" id="hx">Close</button>`,'wcard hm');
 $$('[data-h]').forEach(b=>b.onclick=()=>{cov();setTimeout(H[b.dataset.h],280)});$('#hx').onclick=cov}
$('#hint').onclick=helpMenu;
$('#restart').onclick=()=>{$('#restart').classList.add('spin');setTimeout(()=>$('#restart').classList.remove('spin'),500);
 ov('<p>This clears your progress and the timer.<br>Restart this puzzle?</p><div class="row2"><button class="pill" id="rn">Cancel</button><button class="pill" id="ry">Restart</button></div>','wcard cf');
 $('#ry').onclick=()=>{G.val=G.giv.map((g,i)=>g?G.sol[i]:0);G.notes=Array(81).fill(0);G.hist=[];G.fut=[];G.t=0;G.help=0;G.sel=40;G.au=[0,0,0,0];cov();render();save()};$('#rn').onclick=cov};
function newGame(lv,r){const{sol,p}=r;G={lv,sol,giv:p.map(x=>x?1:0),val:p.slice(),notes:Array(81).fill(0),sel:-1,t:0,hist:[],fut:[],help:0,over:0,au:[0,0,0,0]};GS[lv]=G;pen=0;arm=0;$('#game').classList.remove('won');cells.forEach((c,i)=>{c.style.animation='none';void c.offsetWidth;c.style.animation=''});enterGame(1);save()}
function chk(){if(G.val.some(v=>!v))return;if(G.val.every((v,i)=>v==G.sol[i]))win();else{grid.classList.remove('sk');void grid.offsetWidth;grid.classList.add('sk');toast('Something is not right — check again');feel('err')}}
function win(){G.over=1;if(G.daily)recordStreak(G.date);feel('win');G.sel=-1;arm=0;const a=[S.hl|G.au[0],S.rc|G.au[1],S.ap|G.au[2],S.dd|G.au[3]].map(Number),rec={d:Date.now(),t:G.t,a,h:G.help};(T[G.lv]=T[G.lv]||[]).push(rec);save();render();
 cells.forEach((c,i)=>{c.style.setProperty('--d',Math.abs(R(i)-4)+Math.abs(C(i)-4));c.classList.add('wv')});
 setTimeout(()=>{const t=$('#tm').getBoundingClientRect(),g=$('#gw').getBoundingClientRect();$('#tm').style.setProperty('--ty',Math.max(0,g.top-t.bottom-34)+'px');$('#game').classList.add('won')},900);
 const l=T[G.lv].filter(r=>r.a.join()==a.join()&&r.h==rec.h).sort((x,y)=>x.t-y.t),rk=l.indexOf(rec)+1;
 setTimeout(()=>{ov(`<h2>Marvelous!</h2><div class="wf">Difficulty: ${LV[G.lv][0]}${G.daily?`<br>Streak: ${Str.c} day${Str.c>1?'s':''}`:''}<br>Assists: ${a.map(x=>`<b class="f ${x?'on':''}"></b>`).join('')} &nbsp; Help used: <b class="f ${rec.h?'on':''}"></b></div>`+l.slice(0,10).map((r,i)=>`<div class="wl ${r===rec?'me':''}"><span>${i+1}. ${dt(r.d)}</span><span>${fmt(r.t)}</span></div>`).join('')+(rk>10?`<div class="wl me"><span>${rk}. ${dt(rec.d)}</span><span>${fmt(rec.t)}</span></div>`:'')+'<button class="pill pri" id="w1">Got it!</button>','wcard win');{const g=$('#gw').getBoundingClientRect(),ap=$('#app').getBoundingClientRect();$('.win').style.marginTop=(g.top-ap.top+g.height*.14)+'px'}
  $('#w1').onclick=()=>{cov();setTimeout(()=>toHome(()=>{$('#game').classList.remove('won');hs=['home'];go('home',0)}),400)}},2100)}
function render(){if(!G)return;const s=G.sel,sv=arm||(s>=0?G.val[s]:0);
 G.au=G.au||[0,0,0,0];[S.hl,S.rc,S.ap,S.dd].forEach((v,k)=>{if(v)G.au[k]=1});
 $('#game').classList.toggle('tl',!!S.tl);grid.classList.toggle('nl',!S.gl);$('#gw').classList.toggle('cl',!!S.cl);
 cells.forEach((el,i)=>{const v=G.val[i];let c='c';if(G.giv[i])c+=' g';if(i==s)c+=' s';else if(S.hl&&sv&&v==sv)c+=' m';if(el._p)c+=' p';if(G.mm&&G.mm.includes(i))c+=' mm';if(G.hl&&G.hl.includes(i))c+=' hr';if(el.classList.contains('wv')&&!G.over)el.classList.remove('wv');else if(el.classList.contains('wv'))c+=' wv';
  el.className=c;const k=el.firstChild,t=v?String(v):'';
  if(v){el._nv=0;if(k.textContent!=t||k.firstChild&&k.firstChild.nodeType!=3)k.textContent=t}
  else if(G.notes[i]){if(el._nv!==G.notes[i]){el._nv=G.notes[i];let h='<div class="nt">';for(let d=1;d<10;d++)h+=`<i>${G.notes[i]&(1<<d)?d:''}</i>`;k.innerHTML=h+'</div>'}}
  else{el._nv=0;k.textContent=''}});
 const cnt=Array(10).fill(0);G.val.forEach(v=>cnt[v]++);if(arm&&S.dd&&cnt[arm]>=9)arm=0;
 [...pad.children].forEach((b,k)=>{const d=k+1;if(d>9){b.textContent='X';return}b.classList.toggle('arm',arm==d);b.disabled=(S.dd&&cnt[d]>=9)||!!G.over;b.innerHTML=d+(S.rc?`<small>${Math.max(0,9-cnt[d])}</small>`:'')});
 $('#pen').classList.toggle('on',!!pen);tick()}
function tick(){$('#tm').textContent=S.tc||G.over?fmt(G.t):''}
setInterval(()=>{if(cur=='game'&&G&&!G.over&&!document.hidden&&!$('#ov').classList.contains('on')){G.t++;tick();if(G.t%5==0)save()}},1000);
document.addEventListener('visibilitychange',save);

/* settings */
$$('[data-o]').forEach(b=>b.onclick=()=>{const[t,l]=OP[b.dataset.o];$('#optT').textContent=t;
 $('#optL').innerHTML=l.map(([k,n,d],i)=>`<div class="o" style="--i:${i}"><div class="ot"><h3>${n}</h3>${d?`<p>${d}</p>`:''}</div><button class="sw ${S[k]?'on':''}" data-k="${k}" aria-label="${n}"><i></i></button></div>`).join('');
 $$('.sw').forEach(t=>t.onclick=()=>{const k=t.dataset.k;S[k]=S[k]?0:1;t.classList.toggle('on',!!S[k]);if(k=='an')document.body.classList.toggle('na',!S.an);save()});go('opt')});

/* times */
function tm(){slide($('#tlv'),LV[TL][0],0);$('#tp').style.visibility=TL?'visible':'hidden';$('#tn').style.visibility=TL<4?'visible':'hidden';
 $$('#fl .f').forEach(f=>{const v=f.dataset.f=='h'?F.h:F.a[f.dataset.f];f.classList.toggle('on',v==1);f.classList.toggle('an',v<0)});
 const l=(T[TL]||[]).filter(r=>r.a.every((x,i)=>F.a[i]<0||!!x==!!F.a[i])&&(F.h<0||!!r.h==!!F.h)).sort((a,b)=>a.t-b.t).slice(0,10);
 $('#tlist').innerHTML=l.length?l.map((r,i)=>`<div class="r" style="--i:${i}"><span class="rk">${i+1}</span><span>${new Date(r.d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span><b>${fmt(r.t)}</b><button class="ib" data-d="${r.d}" style="width:40px;height:40px"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button></div>`).join(''):'<div class="emp">No times yet</div>';
 $$('#tlist [data-d]').forEach(b=>b.onclick=()=>{b.parentNode.classList.add('x');setTimeout(()=>{T[TL]=T[TL].filter(r=>r.d!=b.dataset.d);save();tm()},300)})}
$('#tp').onclick=()=>{TL--;tm()};$('#tn').onclick=()=>{TL++;tm()};
$$('#fl .f').forEach(f=>f.onclick=()=>{const k=f.dataset.f,n=v=>v<0?1:v==1?0:-1;if(k=='h')F.h=n(F.h);else F.a[k]=n(F.a[k]);tm()});

/* swipe to change level */
function swipe(row,prev,next){let x0=0,y0=0,on=0,sw=0;
 row.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;on=1;sw=0});
 row.addEventListener('pointerup',e=>{if(!on)return;on=0;const dx=e.clientX-x0,dy=e.clientY-y0;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)*1.3){sw=1;(dx<0?next:prev)()}});
 row.addEventListener('pointercancel',()=>on=0);
 row.addEventListener('click',e=>{if(sw){e.stopPropagation();e.preventDefault();sw=0}},true)}
swipe($('#lp').parentNode,()=>{if(S.lv>0){S.lv--;home(-1);save()}},()=>{if(S.lv<4){S.lv++;home(1);save()}});
swipe($('#tp').parentNode,()=>{if(TL>0){TL--;tm()}},()=>{if(TL<4){TL++;tm()}});

theme(S.th);home();if(G&&G.val&&G.val.length==81)render();else G=null;setTimeout(()=>prefetch(S.lv),600);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('noanim')));
</script></body></html>
