name: Build APK
on:
  push:
    tags-ignore: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unpack project (newest upload wins)
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            rm -rf /tmp/z && mkdir /tmp/z && unzip -oq "$z" -d /tmp/z
            zt=$(git log -1 --format=%ct -- "$z")
            for f in index.html icon.png package.json capacitor.config.json; do
              [ -f "/tmp/z/$f" ] || continue
              if [ -f "$f" ]; then
                ft=$(git log -1 --format=%ct -- "$f")
                [ "$zt" -gt "$ft" ] && cp "/tmp/z/$f" "$f"
              else
                cp "/tmp/z/$f" "$f"
              fi
            done
          done
          true
      - name: Arrange files
        run: |
          mkdir -p www resources
          mv index.html www/index.html
          mv icon.png resources/icon.png
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || echo "icon skipped"
      - name: Min SDK 23 and biometric permission
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Native code (camera and updates)
        run: |
          M=$(find android/app/src/main/java -name MainActivity.java | head -1)
          D=$(dirname "$M")
          PKG=$(grep -m1 '^package' "$M" | sed -E 's/package ([^;]+);/\1/')
          cp "$M" /tmp/MainActivity.orig
          cat > "$D/NativeCam.java" <<'JEOF'
          package com.sudoku.app;

          import android.Manifest;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(
              name = "NativeCam",
              permissions = {
                  @Permission(alias = "media", strings = { Manifest.permission.READ_EXTERNAL_STORAGE }),
                  @Permission(alias = "media33", strings = { Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO })
              }
          )
          public class NativeCam extends Plugin {

              private String alias() {
                  return Build.VERSION.SDK_INT >= 33 ? "media33" : "media";
              }

              @PluginMethod
              public void ensure(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) {
                      call.resolve();
                      return;
                  }
                  requestPermissionForAlias(alias(), call, "permDone");
              }

              @PermissionCallback
              private void permDone(PluginCall call) {
                  if (getPermissionState(alias()) == PermissionState.GRANTED) {
                      call.resolve();
                  } else {
                      call.reject("Allow access to photos and videos (choose Allow all) so the app can import what you capture.");
                  }
              }

              @PluginMethod
              public void open(PluginCall call) {
                  if (getPermissionState(alias()) != PermissionState.GRANTED) {
                      call.reject("Photo and video access is not allowed.");
                      return;
                  }
                  launch(call);
              }

              private void launch(PluginCall call) {
                  try {
                      Intent i = new Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA);
                      getActivity().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Could not open the camera app.");
                  }
              }

              @PluginMethod
              public void list(PluginCall call) {
                  long since = call.getLong("since", 0L);
                  JSArray arr = new JSArray();
                  query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, "img", since, arr);
                  query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, "vid", since, arr);
                  JSObject o = new JSObject();
                  o.put("files", arr);
                  call.resolve(o);
              }

              private void query(Uri base, String kind, long since, JSArray out) {
                  String[] proj = new String[] {
                      MediaStore.MediaColumns._ID,
                      MediaStore.MediaColumns.DISPLAY_NAME,
                      MediaStore.MediaColumns.MIME_TYPE,
                      MediaStore.MediaColumns.SIZE
                  };
                  Cursor c = null;
                  try {
                      c = getContext().getContentResolver().query(
                          base, proj,
                          MediaStore.MediaColumns.DATE_ADDED + ">=?",
                          new String[] { String.valueOf(since) },
                          MediaStore.MediaColumns.DATE_ADDED + " ASC");
                      if (c == null) return;
                      while (c.moveToNext()) {
                          long id = c.getLong(0);
                          JSObject f = new JSObject();
                          f.put("uri", ContentUris.withAppendedId(base, id).toString());
                          f.put("name", c.getString(1));
                          f.put("mime", c.getString(2));
                          f.put("size", c.getLong(3));
                          f.put("kind", kind);
                          out.put(f);
                      }
                  } catch (Exception e) {
                      // ignore: returns what was found so far
                  } finally {
                      if (c != null) c.close();
                  }
              }

              @PluginMethod
              public void copy(PluginCall call) {
                  String u = call.getString("uri");
                  String name = call.getString("name", "file");
                  if (u == null) {
                      call.reject("No file");
                      return;
                  }
                  try {
                      File dir = new File(getContext().getCacheDir(), "vcam");
                      dir.mkdirs();
                      File out = new File(dir, System.nanoTime() + "_" + name.replaceAll("[^A-Za-z0-9._-]", "_"));
                      InputStream in = getContext().getContentResolver().openInputStream(Uri.parse(u));
                      if (in == null) {
                          call.reject("Could not open file");
                          return;
                      }
                      OutputStream os = new FileOutputStream(out);
                      try {
                          byte[] b = new byte[65536];
                          int n;
                          while ((n = in.read(b)) > 0) {
                              os.write(b, 0, n);
                          }
                      } finally {
                          os.close();
                          in.close();
                      }
                      JSObject o = new JSObject();
                      o.put("path", out.getAbsolutePath());
                      call.resolve(o);
                  } catch (Exception e) {
                      call.reject("Could not read file: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void clean(PluginCall call) {
                  try {
                      File dir = new File(getContext().getCacheDir(), "vcam");
                      File[] fs = dir.listFiles();
                      if (fs != null) {
                          for (File f : fs) {
                              f.delete();
                          }
                      }
                  } catch (Exception e) {
                      // ignore
                  }
                  call.resolve();
              }
          }
          JEOF
          cat > "$D/OtaUpdater.java" <<'JEOF'
          package com.sudoku.app;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          /** Downloads a web bundle (zip) and unpacks it into a folder. Plain Java, no Android classes. */
          public final class OtaUpdater {
            public interface Progress { void onProgress(int percent); }

            private OtaUpdater() {}

            /** Downloads urlStr, unpacks to root/name and returns that folder (it contains index.html). */
            public static File downloadAndExtract(String urlStr, File root, String name, Progress progress) throws IOException {
              if (!root.exists() && !root.mkdirs()) throw new IOException("Could not create the update folder");
              File zip = new File(root, name + ".zip.tmp");
              File part = new File(root, name + ".part");
              File dest = new File(root, name);
              deleteTree(zip); deleteTree(part); deleteTree(dest);
              try {
                download(urlStr, zip, progress);
                unzip(zip, part);
                File base = part;
                if (!new File(base, "index.html").isFile()) {
                  File[] kids = part.listFiles();
                  if (kids != null && kids.length == 1 && kids[0].isDirectory() && new File(kids[0], "index.html").isFile()) base = kids[0];
                  else throw new IOException("The update has no index.html");
                }
                if (!base.renameTo(dest)) throw new IOException("Could not save the update");
                return dest;
              } catch (IOException | RuntimeException e) {
                deleteTree(part); deleteTree(dest);
                throw e;
              } finally {
                deleteTree(zip); deleteTree(part);
              }
            }

            /** Deletes every folder in root except keepName. */
            public static void prune(File root, String keepName) {
              File[] all = root.listFiles();
              if (all == null) return;
              for (File f : all) if (!f.getName().equals(keepName)) deleteTree(f);
            }

            static void download(String urlStr, File out, Progress progress) throws IOException {
              String cur = urlStr;
              HttpURLConnection c = null;
              for (int hop = 0; hop < 8; hop++) {
                c = (HttpURLConnection) new URL(cur).openConnection();
                c.setInstanceFollowRedirects(false);
                c.setConnectTimeout(20000);
                c.setReadTimeout(60000);
                c.setRequestProperty("User-Agent", "Sudoku-Updater");
                c.setRequestProperty("Accept-Encoding", "identity");
                int code = c.getResponseCode();
                if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                  String loc = c.getHeaderField("Location");
                  c.disconnect();
                  if (loc == null) throw new IOException("Bad redirect");
                  cur = new URL(new URL(cur), loc).toString();
                  if (!cur.startsWith("https://") && !cur.startsWith("http://localhost") && !cur.startsWith("http://127.0.0.1")) throw new IOException("Blocked a redirect to an unsafe address");
                  c = null;
                  continue;
                }
                if (code / 100 != 2) { c.disconnect(); throw new IOException("Download failed (HTTP " + code + ")"); }
                break;
              }
              if (c == null) throw new IOException("Too many redirects");
              long total = c.getContentLengthLong();
              try (InputStream in = c.getInputStream(); OutputStream os = new FileOutputStream(out)) {
                byte[] buf = new byte[65536];
                long done = 0; int n, last = -1;
                while ((n = in.read(buf)) > 0) {
                  os.write(buf, 0, n);
                  done += n;
                  if (progress != null && total > 0) {
                    int p = (int) (done * 100 / total);
                    if (p != last) { last = p; progress.onProgress(p); }
                  }
                }
                if (total > 0 && done != total) throw new IOException("The download was cut short");
              } finally {
                c.disconnect();
              }
              if (out.length() < 22) throw new IOException("The download is empty");
            }

            static void unzip(File zip, File into) throws IOException {
              if (!into.mkdirs() && !into.isDirectory()) throw new IOException("Could not create a folder");
              String base = into.getCanonicalPath() + File.separator;
              try (ZipInputStream zin = new ZipInputStream(new java.io.BufferedInputStream(new java.io.FileInputStream(zip)))) {
                ZipEntry e;
                byte[] buf = new byte[65536];
                long total = 0;
                while ((e = zin.getNextEntry()) != null) {
                  String nm = e.getName().replace('\\', '/');
                  if (nm.startsWith("./")) nm = nm.substring(2);
                  if (nm.isEmpty()) continue;
                  File f = new File(into, nm);
                  String canon = f.getCanonicalPath();
                  if (!(canon + (e.isDirectory() ? File.separator : "")).startsWith(base)) throw new IOException("Unsafe file name in the update");
                  if (e.isDirectory()) { f.mkdirs(); continue; }
                  File parent = f.getParentFile();
                  if (parent != null && !parent.isDirectory() && !parent.mkdirs()) throw new IOException("Could not create a folder");
                  try (OutputStream os = new FileOutputStream(f)) {
                    int n;
                    while ((n = zin.read(buf)) > 0) {
                      os.write(buf, 0, n);
                      total += n;
                      if (total > 400L * 1024 * 1024) throw new IOException("The update is too large");
                    }
                  }
                }
              }
            }

            static void deleteTree(File f) {
              if (f == null || !f.exists()) return;
              File[] kids = f.listFiles();
              if (kids != null) for (File k : kids) deleteTree(k);
              f.delete();
            }
          }
          JEOF
          cat > "$D/MainActivity.java" <<'JEOF'
          package com.sudoku.app;

          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageInstaller;
          import android.content.pm.PackageManager;
          import android.content.pm.Signature;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {

            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NativeCam.class);
              otaBoot();
              super.onCreate(savedInstanceState);
              otaApply();
              getBridge().getWebView().addJavascriptInterface(new NativeBridge(), "AndroidBridge");
            }

            /* ---------- quick web updates ---------- */
            private static final String OTA_PREFS = "sudoku_ota";
            private static final String CAP_PREFS = "CapWebViewSettings";
            private static final String CAP_PATH = "serverBasePath";

            private File otaRoot() { return new File(getFilesDir(), "ota"); }

            private void otaClear() {
              getSharedPreferences(CAP_PREFS, MODE_PRIVATE).edit().remove(CAP_PATH).commit();
              getSharedPreferences(OTA_PREFS, MODE_PRIVATE).edit().putBoolean("pending", false).remove("name").commit();
              OtaUpdater.prune(otaRoot(), "\u0000");
            }

            // Runs before the web view starts: a new app version, or an update that never reported success, goes back to the built-in files.
            private void otaBoot() {
              try {
                SharedPreferences p = getSharedPreferences(OTA_PREFS, MODE_PRIVATE);
                PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(), 0);
                long code = Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                if (p.getLong("apk", -1) != code) {
                  otaClear();
                  p.edit().putLong("apk", code).commit();
                } else if (p.getBoolean("pending", false)) {
                  otaClear();
                }
              } catch (Exception e) {
                otaClear();
              }
            }

            // After the web view exists: make sure the saved update folder is the one being shown.
            private void otaApply() {
              try {
                String name = getSharedPreferences(OTA_PREFS, MODE_PRIVATE).getString("name", null);
                if (name == null) return;
                File dir = new File(otaRoot(), name);
                if (!new File(dir, "index.html").isFile()) { otaClear(); return; }
                String now = null;
                try { now = (String) getBridge().getClass().getMethod("getServerBase
