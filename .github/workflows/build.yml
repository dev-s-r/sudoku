name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project
        run: for z in *.zip; do unzip -n "$z"; done
      - name: Arrange files
        run: |
          mkdir -p www resources
          mv index.html www/index.html
          mv icon.png resources/icon.png
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || echo "icon skipped"
      - name: Remove splash screen
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          new='''<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="windowSplashScreenBackground">#1b1c22</item>
              <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="android:background">#1b1c22</item>
          </style>'''
          s=re.sub(r'<style name="AppTheme.NoActionBarLaunch".*?</style>',new,s,flags=re.S)
          open(p,'w').write(s)
          PY
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          echo "Using fixed key"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
