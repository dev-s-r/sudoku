name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project
        run: for z in *.zip; do unzip -o "$z"; done
      - name: Arrange files
        run: |
          mkdir -p www resources
          mv index.html www/index.html
          mv icon.png resources/icon.png
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || echo "icon skipped"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
