name: Build APK
on:
  push:
    tags-ignore: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unpack project (newest upload wins)
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            rm -rf /tmp/z && mkdir /tmp/z && unzip -oq "$z" -d /tmp/z
            zt=$(git log -1 --format=%ct -- "$z")
            for f in index.html icon.png package.json capacitor.config.json; do
              [ -f "/tmp/z/$f" ] || continue
              if [ -f "$f" ]; then
                ft=$(git log -1 --format=%ct -- "$f")
                [ "$zt" -gt "$ft" ] && cp "/tmp/z/$f" "$f"
              else
                cp "/tmp/z/$f" "$f"
              fi
            done
          done
          true
      - name: Arrange files
        run: |
          mkdir -p www resources
          mv index.html www/index.html
          mv icon.png resources/icon.png
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000' || echo "icon skipped"
      - name: Min SDK 23 and biometric permission
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Native code (camera and updates)
        run: |
          for f in NativeCam.java OtaUpdater.java MainActivity.java; do
            [ -f "$f" ] || { echo "::error::$f is missing from the repo. Upload it next to index.html."; exit 1; }
          done
          M=$(find android/app/src/main/java -name MainActivity.java | head -1)
          D=$(dirname "$M")
          PKG=$(grep -m1 '^package' "$M" | sed -E 's/package ([^;]+);/\1/')
          cp "$M" /tmp/MainActivity.orig
          cp NativeCam.java OtaUpdater.java MainActivity.java "$D/"
          sed -i "s/^package .*;/package $PKG;/" "$D/NativeCam.java" "$D/OtaUpdater.java" "$D/MainActivity.java"
          MF=android/app/src/main/AndroidManifest.xml
          grep -q READ_MEDIA_IMAGES "$MF" || sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application#' "$MF"
          grep -q REQUEST_INSTALL_PACKAGES "$MF" || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION" />\n    <application#' "$MF"
      - name: Remove splash screen
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          new='''<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="windowSplashScreenBackground">#1b1c22</item>
              <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              <item name="android:background">#1b1c22</item>
          </style>'''
          s=re.sub(r'<style name="AppTheme.NoActionBarLaunch".*?</style>',new,s,flags=re.S)
          open(p,'w').write(s)
          PY
      - name: Signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          mkdir -p ~/.android
          KF=""
          [ -f sudoku.keystore.enc ] && KF=sudoku.keystore.enc
          [ -f signing/sudoku.keystore.enc ] && KF=signing/sudoku.keystore.enc
          if [ -n "$SIGNING_PASSPHRASE" ] && [ -n "$KF" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$KF" -out ~/.android/debug.keystore -pass env:SIGNING_PASSPHRASE
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint\|entry"
            echo "HAVE_KEY=true" >> "$GITHUB_ENV"
            echo "Using your private signing key"
          else
            echo "::warning::No private signing key found. Needs the SIGNING_PASSPHRASE secret and the file sudoku.keystore.enc in the repo. This APK gets a random key, so it will not install over other builds, and no release is published."
          fi
      - name: New version number every build
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $(( 30000000 + ${{ github.run_number }} ))/" android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Write build info
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          export HASH PREV
          HASH=$(cat .github/workflows/build.yml package.json capacitor.config.json NativeCam.java OtaUpdater.java MainActivity.java 2>/dev/null | sha256sum | cut -c1-12)
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null || echo "")
          node -e '
            const fs = require("fs");
            let prev = {};
            try { prev = JSON.parse(process.env.PREV || "{}"); } catch (e) {}
            const build = +process.env.GITHUB_RUN_NUMBER, hash = process.env.HASH;
            const minApk = (prev.nativeHash === hash && prev.minApk) ? prev.minApk : build;
            const notes = (process.env.COMMIT_MSG || "").split("\n")[0].slice(0, 120);
            const info = { build, nativeHash: hash, minApk, notes };
            fs.writeFileSync("www/build-info.json", JSON.stringify(info));
            fs.writeFileSync("release-info.json", JSON.stringify(info));
            console.log(info);
          '
      - run: npx cap sync android
      - name: Build APK
        id: b1
        continue-on-error: true
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rebuild without the native code (runs only if the build above failed)
        if: steps.b1.outcome == 'failure'
        run: |
          echo "::warning::The native camera/update code failed to compile. Building without it."
          D=$(dirname "$(find android/app/src/main/java -name NativeCam.java | head -1)")
          rm -f "$D/NativeCam.java" "$D/OtaUpdater.java"
          cp /tmp/MainActivity.orig "$D/MainActivity.java"
          cd android && ./gradlew assembleDebug
      - name: Collect files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Sudoku.apk
          (cd www && zip -qr ../dist/web-bundle.zip .)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-APK
          path: dist/Sudoku.apk
      - name: Publish update release
        if: env.HAVE_KEY == 'true' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Sudoku build ${{ github.run_number }}
          body_path: release-info.json
          make_latest: true
          files: |
            dist/Sudoku.apk
            dist/web-bundle.zip
      - name: Remove old releases (keep the newest 10)
        if: env.HAVE_KEY == 'true' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +11 | while read -r t; do
            gh release delete "$t" --cleanup-tag -y || true
          done
